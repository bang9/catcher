# Publish the CLI to npm when a cli-v* tag is pushed (e.g. cli-v0.1.1), via npm trusted publishing (OIDC) bound to
# this workflow file and the "npm" environment. No npm token is stored anywhere.
name: release cli

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm e2e
      - name: Check tag matches the package version
        run: test "cli-v$(node -p "require('./apps/cli/package.json').version")" = "${GITHUB_REF_NAME}"

  # only this job can mint the OIDC token; npm trusted publishing (no npm token anywhere) — provenance is automatic
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter catcher-cli build
      - name: Publish
        working-directory: apps/cli
        # the bundle inlines every dependency; drop the workspace-only devDependencies from the published manifest
        run: |
          npm pkg delete devDependencies scripts
          npm publish --access public
