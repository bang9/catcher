# Release the catcher CLI when a cli-v* tag is pushed (e.g. cli-v0.2.0):
#   check   → the tag must equal crates/catcher-cli/Cargo.toml's version
#   test    → cargo fmt / clippy / test, protocol tests, e2e
#   build   → one native binary per target (smoke-tested where the runner can execute it)
#   release → SHA256SUMS, build provenance attestations, a public GitHub Release (the only job that can write)
#   npm     → the catcher-cli launcher (npm/catcher-cli) via npm trusted publishing (OIDC), bound to this workflow file
#             and the "npm" environment. No npm token is stored anywhere; provenance is attached.
# Release asset names are a contract with apps/server/public/install.sh and npm/catcher-cli: catcher-<target>[.exe]
# (raw binaries), catcher-<target>.tar.gz / .zip (with LICENSE and README), SHA256SUMS.
name: release cli

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/catcher-cli/Cargo.toml | head -n 1)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::crates/catcher-cli/Cargo.toml has no usable version ($version)"
            exit 1
          fi
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/catcher-cli/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # never use caching in release builds
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: pnpm test
      - run: pnpm e2e

  build:
    needs: [check, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false } # cross-compiled on Apple silicon
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml) and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: musl C toolchain (ring)
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build (release profile strips symbols)
        run: cargo build --release --locked -p catcher-cli --target "$TARGET"
      - name: Package
        run: |
          ext=''
          if [ "$RUNNER_OS" = 'Windows' ]; then ext='.exe'; fi
          bin="target/$TARGET/release/catcher$ext"
          mkdir -p dist "stage/catcher-$TARGET"
          cp "$bin" "dist/catcher-$TARGET$ext"
          cp "$bin" LICENSE README.md "stage/catcher-$TARGET/"
          if [ "$RUNNER_OS" = 'Windows' ]; then
            (cd stage && 7z a -tzip "../dist/catcher-$TARGET.zip" "catcher-$TARGET" > /dev/null)
          else
            tar -C stage -czf "dist/catcher-$TARGET.tar.gz" "catcher-$TARGET"
          fi
          ls -l dist
      - name: Smoke test
        if: matrix.smoke
        run: |
          ext=''
          if [ "$RUNNER_OS" = 'Windows' ]; then ext='.exe'; fi
          out=$("dist/catcher-$TARGET$ext" --version | tr -d '\r')
          echo "$out"
          test "$out" = "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- catcher-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 10
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          cat > notes.md <<EOF
          Install on macOS / Linux: \`curl -fsSL https://catcher.bang9.dev/install.sh | sh\`
          Install anywhere with Node 20+: \`npm i -g catcher-cli@$VERSION\`
          Agents: tell yours to read https://catcher.bang9.dev/agent.md

          Every file is listed in SHA256SUMS and has a build provenance attestation:
          \`gh attestation verify catcher-<target> --repo $GITHUB_REPOSITORY\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "catcher CLI $VERSION" --notes-file notes.md "${flags[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # only this job can mint the npm OIDC token (environment "npm", trusted publisher bound to release-cli.yml)
  npm:
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}/release
      - name: Stamp the version and embed the checksums
        run: |
          node npm/catcher-cli/scripts/prepare-release.mjs "$VERSION" "$RUNNER_TEMP/release/SHA256SUMS"
          cp LICENSE npm/catcher-cli/LICENSE
      - name: Smoke test the launcher against the published release
        working-directory: npm/catcher-cli
        env:
          CATCHER_HOME: ${{ runner.temp }}/catcher-home
        run: test "$(node bin/catcher.js --version)" = "$VERSION"
      - name: Publish
        working-directory: npm/catcher-cli
        run: |
          tag='latest'
          case "$VERSION" in *-*) tag='next' ;; esac
          npm publish --access public --provenance --tag "$tag"
