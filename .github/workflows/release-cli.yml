# Publish the CLI to npm with provenance when a cli-v* tag is pushed (e.g. cli-v0.1.0). Needs NPM_TOKEN in the
# "npm" environment.
name: release cli

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm e2e
      - name: Check tag matches the package version
        run: test "cli-v$(node -p "require('./apps/cli/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
