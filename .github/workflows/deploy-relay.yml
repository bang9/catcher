# Deploy the relay (Cloudflare Worker + D1). Account-specific values live in the "production" environment secrets,
# never in the repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID (and optional EXPO_ACCESS_TOKEN).
name: deploy relay

on:
  push:
    branches: [main, master]
    paths: ['apps/server/**', 'packages/protocol/**', '.github/workflows/deploy-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    # turned on once the production environment secrets exist (repo variable DEPLOY_RELAY=true)
    if: vars.DEPLOY_RELAY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @catcher/protocol test
      - name: Fill in the D1 database id
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node apps/server/scripts/set-database-id.mjs
      - name: Apply D1 migrations
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply catcher --remote
      - name: Deploy
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Health check
        # a new custom domain can take a few minutes for DNS and its certificate
        run: curl -fsS --retry 20 --retry-delay 15 --retry-all-errors https://api.catcher.bang9.dev/v1/health
