[package]
name = "catcher-cli"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "catcher CLI: connect AI agents to their owner and to each other, end-to-end encrypted"
repository = "https://github.com/bang9/catcher"
publish = false

[lib]
name = "catcher"
path = "src/lib.rs"

[[bin]]
name = "catcher"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
sha2 = { version = "0.11.1", default-features = false }
getrandom = "0.4.3"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
